services:
  ollama:
    build:
      context: .
      dockerfile: deploy/Dockerfile.ollama
    image: ta-ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=30
      - OLLAMA_MODEL=ministral-3:3b
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  docling-serve:
    build:
      context: .
      dockerfile: deploy/Dockerfile.docling
    container_name: docling-serve
    ports:
      - "5001:5001"
    environment:
      - DOCLING_SERVE_ENABLE_UI=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 0
              capabilities: [gpu]
    restart: unless-stopped

  # Векторная база данных для семантического поиска по каталогу
  # Наполнение: python scripts/catalog_ingest_qdrant.py
  qdrant:
    container_name: qdrant
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API + Web UI  →  http://localhost:6333/dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  webui:
    build:
      context: .
      dockerfile: deploy/webui/Dockerfile
    container_name: ta-webui
    ports:
      - "8000:8000"
    environment:
      - WEBUI_HOST=0.0.0.0
      - WEBUI_PORT=8000
      - LLM_BASE_URL=http://ollama:11434
      - LLM_MODEL=ministral-3:3b
      - EMBEDDING_BASE_URL=http://ollama:11434
      - EMBEDDING_MODEL=bge-m3
      - DOCLING_BASE_URL=http://docling-serve:5001
      - QDRANT_URL=http://qdrant:6333
      - TZ=Asia/Irkutsk
    volumes:
      - webui_data:/app/data
      - webui_logs:/app/logs
    depends_on:
      - ollama
      - docling-serve
    restart: unless-stopped

  # Веб-интерфейс к Ollama для директора (не связан с ta-webui)
  open-webui:
    image: ghcr.io/open-webui/open-webui:cuda
    container_name: open-webui
    ports:
      - "3000:8080"
    volumes:
      - open-webui_data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - VECTOR_DB=qdrant
      - QDRANT_URI=http://qdrant:6333
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 0
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  qdrant_data:
  ollama_data:
  open-webui_data:
  webui_data:
  webui_logs: